[package]
name = "deepfish-desktop-pet"
version = "1.0.0"
description = "蓝色大肥鱼 macOS 桌宠"
authors = ["DeepFish Desktop Pet contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "deepfish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric conversions in the click-through/hit-testing maths are deliberate and
# bounded; documenting every one of them would drown the useful warnings.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Tauri command arguments are deserialized from IPC and must own their data, and
# the storage helpers mirror that shape.
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
