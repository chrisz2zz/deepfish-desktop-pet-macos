<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost">
    <title>大肥鱼桌宠</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="pet-app" class="pet-app frame-mode" aria-label="大肥鱼桌宠">
      <section id="speech" class="speech" role="status" aria-live="polite">
        <strong id="phase-label">专注营业</strong>
        <span id="speech-text">让我看看今天有什么问题。</span>
      </section>

      <section id="chat-panel" class="chat-panel" aria-label="聊天窗口" hidden>
        <div class="chat-bar">
          <button id="session-button" class="chat-session" type="button" title="切换会话" aria-expanded="false">
            <span id="session-title">新对话</span>
            <span class="chat-caret" aria-hidden="true">▾</span>
            <span id="session-running" class="chat-running" aria-label="处理中" hidden></span>
          </button>
          <button id="session-new" class="icon-button" type="button" title="新建会话" aria-label="新建会话">＋</button>
          <button id="session-compact" class="icon-button" type="button" title="压缩上下文" aria-label="压缩上下文">⤓</button>
          <button id="chat-close" class="icon-button" type="button" title="关闭聊天" aria-label="关闭聊天">×</button>
        </div>
        <div id="session-list" class="session-list" hidden>
          <div class="session-list-head">
            <span>会话</span>
            <span id="provider-label" class="chat-provider">免费模型</span>
          </div>
          <div id="session-items" class="session-items"></div>
        </div>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="1" maxlength="600" autocomplete="off" placeholder="问大肥鱼…（Shift+回车换行）" aria-label="聊天内容，回车发送，Shift+回车换行"></textarea>
          <button type="submit" title="发送" aria-label="发送">↑</button>
        </form>
      </section>

      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <div id="pet-stage" class="pet-stage" tabindex="0" role="button" aria-label="拖动或点击大肥鱼，按回车打开聊天">
        <div class="floor-shadow"></div>
        <img id="character" class="character" src="../../assets/frames/frame-neutral.png" alt="蓝色大肥鱼桌宠" draggable="false">
        <div id="expression-layer" class="expression-layer" aria-hidden="true">
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="blush blush-left"></span>
          <span class="blush blush-right"></span>
          <span class="tear tear-left"></span>
          <span class="tear tear-right"></span>
          <span class="sweat-drop"></span>
          <span class="expression-mouth"></span>
        </div>
        <div id="scene-layer" class="scene-layer" aria-hidden="true">
          <span class="prop prop-laptop">⌨</span>
          <span class="prop prop-coffee">☕</span>
          <span class="prop prop-bowl">🍚</span>
          <span class="prop prop-sink">🫧</span>
          <span class="prop prop-toy">🐋</span>
          <span class="prop prop-chair">♨</span>
          <span class="prop prop-guns">🔫</span>
          <span class="prop prop-cloud">☁</span>
          <span class="prop prop-handkerchief">▱</span>
          <span class="prop prop-price">¥</span>
        </div>
        <div id="sleep-mark" class="sleep-mark" aria-hidden="true">Z</div>
        <div id="mood" class="mood" aria-hidden="true">♡</div>
        <button id="chat-fab" class="chat-fab" type="button" title="和大肥鱼聊天" aria-label="和大肥鱼聊天">💬</button>
      </div>
      <p class="hint">点 💬 聊天 · 右键菜单</p>
    </main>
    <script src="../shared/desktop-bridge.js"></script>
    <script src="../shared/circadian.js"></script>
    <script src="../shared/behaviors.js"></script>
    <script src="../shared/gesture.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
