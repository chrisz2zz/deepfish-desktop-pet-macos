[package]
name = "deepfish-desktop-pet"
version = "1.0.0"
description = "蓝色大肥鱼 macOS 桌宠"
authors = ["DeepFish Desktop Pet contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "deepfish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
