<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'self' ipc: http://ipc.localhost">
    <title>大肥鱼设置</title>
    <link rel="stylesheet" href="./settings.css">
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <img src="../../assets/character.png" alt="大肥鱼">
        <div><h1>大肥鱼设置</h1><p>桌宠行为与聊天模型</p></div>
      </header>

      <form id="settings-form">
        <section>
          <h2>聊天模型</h2>
          <div class="segmented" role="radiogroup" aria-label="模型服务商">
            <label><input type="radio" name="provider" value="pollinations"><span>免费模型</span></label>
            <label><input type="radio" name="provider" value="deepseek"><span>DeepSeek</span></label>
            <label><input type="radio" name="provider" value="custom"><span>自定义</span></label>
          </div>
          <label class="field"><span>API 地址</span><input id="endpoint" name="endpoint" type="url" required></label>
          <label class="field"><span>模型名称</span><input id="model" name="model" required></label>
          <label class="field" id="key-field"><span>API Key</span><input id="api-key" name="apiKey" type="password" autocomplete="new-password" placeholder="未填写"><small id="key-status"></small><small class="field-hint">只保存在本机配置文件中（权限 0600），不写入系统钥匙串，也不会申请访问其他密钥</small></label>
          <label class="check"><input id="clear-key" type="checkbox"><span>清除已保存的 API Key</span></label>
          <div id="deepseek-tools" class="tool-toggles">
            <label class="check"><input id="deepseek-search" type="checkbox"><span>开启联网搜索（Search）</span></label>
            <label class="check"><input id="deepseek-fetch" type="checkbox"><span>开启网页抓取（Fetch）</span></label>
            <small class="field-hint">开启后模型多出 <code>web_search</code> / <code>web_fetch</code> 两个工具，查询词与链接会发给 DeepSeek 的 <code>/v1/tools/*</code> 接口；按成功请求计费（各 5 元 / 1000 次），仅在使用 DeepSeek 时可用。</small>
          </div>
        </section>

        <section>
          <h2>桌宠行为</h2>
          <label class="switch-row"><span><strong>始终置顶</strong><small>保持在其他窗口上方</small></span><input id="always-on-top" type="checkbox"></label>
          <label class="switch-row"><span><strong>音效</strong><small>预留行为音效开关</small></span><input id="sound" type="checkbox"></label>
          <label class="switch-row"><span><strong>自动散步</strong><small>按作息在当前屏幕内来回走动</small></span><input id="free-walk" type="checkbox"></label>
          <label class="switch-row"><span><strong>身体区域感应</strong><small>散步时经过头发、脸和腿触发不同反馈</small></span><input id="interactive-zones" type="checkbox"></label>
          <label class="switch-row"><span><strong>标志性台词</strong><small>允许更放飞的模型梗和吐槽</small></span><input id="spicy-lines" type="checkbox"></label>
          <label class="field"><span>显示比例 <output id="scale-output">100%</output></span><input id="scale" type="range" min="0.6" max="1.15" step="0.05"></label>
          <label class="field"><span>行为频率 <output id="behavior-output">100%</output></span><input id="behavior-intensity" type="range" min="0.5" max="1.8" step="0.1"></label>
        </section>

        <section>
          <h2>Agent 上限</h2>
          <label class="field"><span>单次问答循环上限</span><input id="agent-loop-limit" type="number" min="1" max="200" step="1" required><small>一次提问里模型最多来回几轮，默认 50；到顶后会强制收尾，防止死循环</small></label>
          <label class="field"><span>单次问答工具调用上限</span><input id="tool-call-limit" type="number" min="1" max="100" step="1" required><small>一次提问里最多执行多少次工具，默认 10；超出后剩下的调用直接返回"超额度"给模型</small></label>
        </section>

        <section>
          <h2>命令沙箱</h2>
          <label class="switch-row"><span><strong>在系统沙箱里执行命令</strong><small>只允许写当前目录、临时目录和构建缓存；只读命令禁止联网，需审批的命令才可以联网。关闭后命令直接以你的权限运行</small></span><input id="sandboxed-commands" type="checkbox" checked></label>
          <small class="field-hint">沙箱由系统自带的 <code>sandbox-exec</code> 提供，仅 macOS 生效；沙箱不可用时会拒绝执行并提示手动运行，不会静默降级。</small>
        </section>

        <p id="status" class="status" role="status"></p>
        <div class="actions"><button id="reset-provider" class="secondary" type="button">恢复免费模型</button><button type="submit">保存设置</button></div>
      </form>
    </main>
    <script src="../shared/desktop-bridge.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
